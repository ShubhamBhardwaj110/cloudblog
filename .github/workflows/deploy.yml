name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC → short-lived AWS credentials, no access keys stored in GitHub

# Never run two deploys at once; queue instead of cancelling a half-applied deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.2
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Test, apply infrastructure, publish site
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.out.outputs.site_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # so `terraform output -raw` returns clean values

      - name: Install, typecheck, test
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Bundle Lambda functions
        run: npm run build -w backend

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform apply
        working-directory: infra/envs/prod
        env:
          TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -input=false -auto-approve

      - name: Build and publish frontend
        run: scripts/deploy-frontend.sh

      - id: out
        run: echo "site_url=$(terraform -chdir=infra/envs/prod output -raw site_url)" >> "$GITHUB_OUTPUT"
